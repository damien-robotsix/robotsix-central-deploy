# Traefik static configuration — the fleet edge.
#
# Static config is read once at start-up; changing it needs a Traefik restart.
# Routing is NOT here: every component's routes arrive as Docker labels stamped
# by central-deploy at container-create time (registry/traefik_labels.py), so
# onboarding a component requires no change to this file, to DNS, or to
# anything else on the host.
#
# The base domain appears in exactly one place — the `domains` block below. It
# MUST match central-deploy's `gateway_base_domain` setting, or components get
# routes for a hostname this certificate does not cover.

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    http:
      tls:
        certResolver: ovh
        # Requested once, for the whole fleet. Per-router certificates would
        # mean one ACME order per component and a rate-limit problem on any
        # day with several onboardings.
        domains:
          - main: "deploy.robotsix.net"
            sans:
              - "*.deploy.robotsix.net"

providers:
  # Routes come from container labels. Traefik reads the Docker API through a
  # read-only socket proxy (see docker-compose.yml) — it never gets the write
  # scopes central-deploy needs, so a Traefik compromise cannot start, stop, or
  # replace containers.
  docker:
    endpoint: "tcp://traefik-socket-proxy:2375"
    # Nothing is published unless it carries traefik.enable=true. Without this
    # every managed container would be exposed the moment it started.
    exposedByDefault: false
    network: central-deploy-proxy

  # Middleware definitions (the auth gates) — watched, so edits apply live.
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

certificatesResolvers:
  ovh:
    acme:
      # Wildcard certificates are only obtainable via DNS-01. Credentials come
      # from the environment (OVH_ENDPOINT, OVH_APPLICATION_KEY,
      # OVH_APPLICATION_SECRET, OVH_CONSUMER_KEY) — never from this file.
      # The ACME account email is likewise set via
      # TRAEFIK_CERTIFICATESRESOLVERS_OVH_ACME_EMAIL so no address is committed.
      storage: /letsencrypt/acme.json
      dnsChallenge:
        provider: ovh
        # OVH's nameservers are slow to converge; without a delay the first
        # order fails its self-check and Traefik retries with backoff.
        delayBeforeCheck: 10

log:
  level: INFO

accessLog: {}

api:
  # No dashboard: it would need its own hostname and its own auth rule, and
  # `docker logs traefik` plus the access log answer the same questions.
  dashboard: false
