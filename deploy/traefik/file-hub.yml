# ---------------------------------------------------------------------------
# file-hub.deploy.robotsix.net — bootstrap route
#
# This is a TEMPORARY static route for the file-hub component, which runs
# outside central-deploy's management.  Once file-hub is onboarded into
# central-deploy (POST /onboard/confirm), its container will carry the
# Traefik labels generated by registry/traefik_labels.py and this file
# can be removed — the Docker provider will serve the same routes with
# no static config.
#
# The shape mirrors registry/traefik_labels.py exactly: one health router
# (priority 30, no auth) and one browser router (priority 10, tinyauth).
# ---------------------------------------------------------------------------
http:
  routers:
    file-hub-health:
      rule: "Host(`file-hub.deploy.robotsix.net`) && Path(`/health`)"
      priority: 30
      entrypoints: websecure
      service: file-hub
    file-hub:
      rule: "Host(`file-hub.deploy.robotsix.net`)"
      priority: 10
      entrypoints: websecure
      middlewares: tinyauth@file
      service: file-hub

  services:
    file-hub:
      loadBalancer:
        servers:
          - url: "http://file-hub:8080"
