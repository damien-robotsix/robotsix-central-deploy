# Traefik dynamic configuration — the fleet's auth gate.
#
# Watched by Traefik, so edits here apply without a restart.
#
# Nothing here may name a component or a per-component hostname — that is the
# repo-agnostic rule in AGENT.md, and it applies to this file exactly as it
# applies to the engine. Component routes arrive as Docker labels derived by
# registry/traefik_labels.py, which reference the middleware below by name
# (`tinyauth@file`, `mobile-token@file`).
#
# One gate, deliberately. An HTTP Basic middleware for machine callers lived
# here briefly. Because it was keyed with the fleet's existing nginx htpasswd,
# every browser that had ever authenticated against the old ingress replayed
# that credential automatically and was served without ever seeing the SSO
# login — the access log showed real browser sessions arriving on the machine
# router. A second door whose key every client already holds is not defence in
# depth, so there is no longer one. Machine callers reach components over the
# internal Docker network, which never passes through the edge.
#
# Mobile native apps (e.g. robotsix-chat-mobile) cannot use the browser SSO
# session-cookie flow.  The `mobile-token` ForwardAuth below validates a
# Bearer token issued by central-deploy's `GET /auth/token` endpoint (which
# the user obtains once by authenticating through tinyauth in a WebView).
# Requests carrying a valid `Authorization: Bearer <token>` header are
# admitted directly; all other requests still pass through tinyauth.

http:
  # Fleet-wide auth handoff routes.  The mobile login flow must work with any
  # component hostname as the app's base URL, so these routers match on PATH
  # alone (no Host — the repo-agnostic rule).  They point at the auth engine
  # (central-deploy), exactly like the `mobile-token` ForwardAuth middleware
  # below already does.
  #
  # - /auth/login is PUBLIC: it only stores the app's deep-link target in a
  #   short-lived cookie and bounces to /auth/login/complete.  No token is
  #   issued without SSO.
  # - /auth/login/complete sits behind tinyauth: the engine sees Remote-User
  #   and issues the bearer token.  The path is deliberately query-free —
  #   tinyauth drops query strings when rebuilding its post-login redirect.
  # - /chat/auth/mobile-token is PUBLIC: it validates and echoes a token the
  #   caller already holds; invalid tokens get 401.
  routers:
    fleet-auth-login:
      rule: "Path(`/auth/login`)"
      entryPoints: [websecure]
      service: fleet-auth
      priority: 25
    fleet-auth-login-complete:
      rule: "Path(`/auth/login/complete`)"
      entryPoints: [websecure]
      middlewares: [tinyauth]
      service: fleet-auth
      priority: 25
    fleet-auth-token-exchange:
      rule: "Path(`/chat/auth/mobile-token`)"
      entryPoints: [websecure]
      service: fleet-auth
      priority: 25

  services:
    fleet-auth:
      loadBalancer:
        servers:
          - url: "http://central-deploy:8100"

  middlewares:
    # Every externally routed request. Unauthenticated ones are redirected to
    # tinyauth's login page and come back with a session cookie valid
    # fleet-wide. The only exception is each component's /health route, which
    # carries no middleware at all — see registry/traefik_labels.py.
    tinyauth:
      forwardAuth:
        address: "http://tinyauth:3000/api/auth/traefik"
        authResponseHeaders:
          - Remote-User
          - Remote-Name
          - Remote-Email
          - Remote-Groups

    # Mobile bearer-token validator.  Traefik calls central-deploy's
    # /auth/validate endpoint for every request carrying an Authorization:
    # Bearer header (routed at higher priority than tinyauth).  When the
    # token is valid the endpoint returns 200 + Remote-User; when it is
    # missing, expired, or revoked the endpoint returns 401 and the request
    # is rejected at the edge.
    mobile-token:
      forwardAuth:
        address: "http://central-deploy:8100/auth/validate"
        authResponseHeaders:
          - Remote-User
