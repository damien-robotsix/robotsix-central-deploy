name: Release image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/docker-release.yml@86a722f2938c1dda343bbf8d3c5989613cbf1794  # v1.5.0
    permissions:
      contents: read
      packages: write       # push image to GHCR
      id-token: write       # provenance / SBOM attestation signing
      attestations: write   # build provenance attestation
      security-events: write  # Trivy SARIF upload to Code Scanning
