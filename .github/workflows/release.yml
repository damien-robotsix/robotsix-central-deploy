name: Release image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/docker-release.yml@c4caf23ade98668434145f5b1abd3bc42cec63e7  # main
    permissions:
      contents: read
      packages: write       # push image to GHCR
      id-token: write       # provenance / SBOM attestation signing
      attestations: write   # build provenance attestation
      security-events: write  # Trivy SARIF upload to Code Scanning
