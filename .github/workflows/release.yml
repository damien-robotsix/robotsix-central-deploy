name: Release image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/docker-release.yml@188518bece972d7d5f1c4e2a0f2226d2526dc0fa  # main
    permissions:
      contents: read
      packages: write       # push image to GHCR
      id-token: write       # provenance / SBOM attestation signing
      attestations: write   # build provenance attestation
      security-events: write  # Trivy SARIF upload to Code Scanning
