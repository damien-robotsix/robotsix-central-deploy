name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Repository-specific gates (no shared-workflow equivalent) ──

  docs-dedup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Verify DEPLOY_CONTRACT.md is a symlink (not a stale copy)
        run: |
          set -euo pipefail
          if [ ! -L src/robotsix_central_deploy/ui/DEPLOY_CONTRACT.md ]; then
            echo "::error::src/robotsix_central_deploy/ui/DEPLOY_CONTRACT.md must be a symlink to the canonical copy"
            exit 1
          fi
      - name: Verify DEPLOY_CONTRACT.md symlink target is correct
        run: |
          set -euo pipefail
          target=$(readlink src/robotsix_central_deploy/ui/DEPLOY_CONTRACT.md)
          expected="../../../docs/ui/DEPLOY_CONTRACT.md"
          if [ "$target" != "$expected" ]; then
            echo "::error::src/robotsix_central_deploy/ui/DEPLOY_CONTRACT.md symlink target is '$target', expected '$expected'"
            exit 1
          fi
      - name: Verify symlink resolves and content matches
        run: |
          set -euo pipefail
          diff docs/ui/DEPLOY_CONTRACT.md src/robotsix_central_deploy/ui/DEPLOY_CONTRACT.md

  # Detect whether the PR touches only documentation files (*.md, docs/**).
  # Used downstream to skip the malware check on docs-only PRs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.filter.outputs.docs-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@0bc4621a3135347011ad047f9ecf449bf72ce2bd  # v3.0.0
        id: filter
        with:
          filters: |
            docs-only:
              - '**/*.md'
              - 'docs/**'

  # ── Shared fleet workflows (lint, type-check, test, security, container scan) ──

  lint:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      - name: Install dev deps
        run: uv sync --frozen
        env:
          UV_PROJECT_ENVIRONMENT: system
          UV_MALWARE_CHECK: ${{ needs.changes.outputs.docs-only == 'true' && '0' || '1' }}

      - name: Check lockfile freshness
        run: uv lock --check


      - name: deptry (dependency hygiene)
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: uv run --with deptry deptry .

      - name: Dependency audit (CVE scan)
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: |
          if uv audit --help >/dev/null 2>&1; then
            uv audit --frozen --preview
          else
            uv export --frozen --no-hashes | grep -v '^-e \.' | uv run --with pip-audit pip-audit -r /dev/stdin
          fi

      - name: Ruff (lint + format check)
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check --diff .

  typecheck:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      - name: Install dev deps
        run: uv sync --frozen
        env:
          UV_PROJECT_ENVIRONMENT: system
          UV_MALWARE_CHECK: ${{ needs.changes.outputs.docs-only == 'true' && '0' || '1' }}

      - name: Mypy (static type check)
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: uv run mypy src/ --strict

      - name: Bandit (security SAST)
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: uv run --with 'bandit[toml]' bandit -c pyproject.toml -r src/ --severity-level medium

  test:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      - name: Install dev deps
        run: uv sync --frozen
        env:
          UV_PROJECT_ENVIRONMENT: system
          UV_MALWARE_CHECK: ${{ needs.changes.outputs.docs-only == 'true' && '0' || '1' }}

      - name: Dead code detection (vulture)
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: uv run vulture

      - name: Run tests
        env:
          UV_PROJECT_ENVIRONMENT: system
          GIT_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: |
          uv run --with pytest-xdist --with pytest-cov pytest tests/ -n auto --dist loadscope -x --tb=long --cov --cov-fail-under=80 --cov-report=term-missing --cov-report=html

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: coverage-html
          path: htmlcov/

  python-security:
    name: Security scan (shared)
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-security.yml@f343f5ca84b1d54bb4c2fdcb83568724aa9f743c  # main
    permissions:
      contents: read
    with:
      install-extras: ""
      trufflehog-pr-diff: true
      trufflehog-extra-args: "--results=verified,unknown --exclude-detectors=lob"

  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: robotsix-central-deploy:ci
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: robotsix-central-deploy:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3  # v4.37.6
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ── Custom jobs (repository-specific checks not covered by shared workflows) ──

  vulture:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - name: Install dev deps
        run: uv sync --frozen
        env:
          UV_PROJECT_ENVIRONMENT: system
          UV_MALWARE_CHECK: ${{ needs.changes.outputs.docs-only == 'true' && '0' || '1' }}
      - name: Dead code detection (vulture)
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: uv run vulture

  docs:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - name: Build docs (strict)
        run: uv run --group docs mkdocs build --strict
        env:
          UV_MALWARE_CHECK: ${{ needs.changes.outputs.docs-only == 'true' && '0' || '1' }}

  hadolint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6  # v3.4.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: hadolint.sarif
          no-fail: true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3  # v4
        if: always()
        with:
          sarif_file: hadolint.sarif
          category: hadolint

  grep-lint:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
        env:
          UV_MALWARE_CHECK: ${{ needs.changes.outputs.docs-only == 'true' && '0' || '1' }}
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Install TruffleHog
        run: |
          TRUFFLEHOG_VERSION=3.95.9
          curl -sSfL "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin trufflehog
      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Flag raw health/state/backend strings outside enum definition
        run: |
          set -euo pipefail
          violations=0
          # Health strings (exclude models.py where the enum lives)
          for pattern in '"healthy"' '"unhealthy"' '"starting"'; do
            matches=$(grep -rn "$pattern" src/robotsix_central_deploy/lifecycle/ --include='*.py' \
              --exclude='models.py' || true)
            if [ -n "$matches" ]; then
              echo "::error file={},line={}::Raw health string $pattern found outside models.py"
              echo "$matches"
              violations=$((violations + 1))
            fi
          done
          # Update-state strings (exclude models.py)
          for pattern in '"up-to-date"' '"update-available"'; do
            matches=$(grep -rn "$pattern" src/robotsix_central_deploy/lifecycle/ --include='*.py' \
              --exclude='models.py' || true)
            if [ -n "$matches" ]; then
              echo "::error file={},line={}::Raw update-state string $pattern found outside models.py"
              echo "$matches"
              violations=$((violations + 1))
            fi
          done
          # Store-backend strings (exclude models.py and conftest)
          for pattern in '"memory"' '"file"'; do
            matches=$(grep -rn "$pattern" src/robotsix_central_deploy/lifecycle/ --include='*.py' \
              --exclude='models.py' || true)
            if [ -n "$matches" ]; then
              echo "::error file={},line={}::Raw store-backend string $pattern found outside models.py"
              echo "$matches"
              violations=$((violations + 1))
            fi
          done
          # Execution-backend strings (exclude models.py where the enum lives,
          # and backend.py/noop.py/chat_preview.py/docker_cli.py where
          # "docker"/"noop" references the CLI binary or credential values,
          # not the backend type)
          for pattern in '"docker_sdk"' '"docker"' '"noop"'; do
            matches=$(grep -rn "$pattern" src/robotsix_central_deploy/lifecycle/ --include='*.py' \
              --exclude='models.py' --exclude='backend.py' --exclude='noop.py' --exclude='chat_preview.py' --exclude='docker_cli.py' || true)
            if [ -n "$matches" ]; then
              echo "::error file={},line={}::Raw execution-backend string $pattern found outside models.py"
              echo "$matches"
              violations=$((violations + 1))
            fi
          done
          # ServiceState strings (exclude models.py where the enum lives,
          # and _util.py where Docker status strings are legitimately mapped
          # to ServiceState values).  "failed" and "unknown" are omitted:
          # they are too generic and appear in unrelated contexts throughout
          # the codebase.
          for pattern in '"stopped"' '"starting"' '"running"' '"stopping"' '"restarting"'; do
            matches=$(grep -rn "$pattern" src/robotsix_central_deploy/lifecycle/ --include='*.py' \
              --exclude='models.py' --exclude='_util.py' || true)
            if [ -n "$matches" ]; then
              echo "::error file={},line={}::Raw ServiceState string $pattern found outside enum definition"
              echo "$matches"
              violations=$((violations + 1))
            fi
          done
          # Dashboard UI ServiceState seam: verify strings used with
          # svc.state in dashboard.js are valid ServiceState values.
          dashboard_state_strings=$(grep "svc\.state" src/robotsix_central_deploy/ui/static/dashboard.js \
            | grep -oE "(=== |\|\| )'[^']*'" \
            | grep -o "'[^']*'" | tr -d "'" | sort -u || true)
          if [ -n "$dashboard_state_strings" ]; then
            for s in $dashboard_state_strings; do
              case "$s" in
                stopped|starting|running|stopping|restarting|failed|unknown) ;;
                *)
                  echo "::error file=dashboard.js,line=1::Dashboard uses non-ServiceState string '$s' with svc.state"
                  violations=$((violations + 1))
                  ;;
              esac
            done
          fi
          if [ "$violations" -gt 0 ]; then
            echo "::error::Found $violations violation(s) of enum-only string policy"
            exit 1
          fi
          echo "All grep-lint checks passed."

  lint-actions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Run actionlint
        run: '"$(go env GOPATH)/bin/actionlint"'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - name: Run zizmor
        run: uv tool run --from zizmor zizmor .github/workflows/

  module-taxonomy:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
        env:
          UV_MALWARE_CHECK: ${{ needs.changes.outputs.docs-only == 'true' && '0' || '1' }}
      - name: Validate module taxonomy
        run: uv run robotsix-modules-validate docs/modules.yaml

  config-schema-drift:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
        env:
          UV_MALWARE_CHECK: ${{ needs.changes.outputs.docs-only == 'true' && '0' || '1' }}
      - name: Check config/config.schema.json drift
        run: |
          uv run python - <<'EOF'
          from robotsix_central_deploy.lifecycle.config import LifecycleConfig
          import robotsix_config, pathlib, sys
          generated = robotsix_config.config_schema_json(LifecycleConfig)
          committed = pathlib.Path("config/config.schema.json").read_text()
          if generated.strip() != committed.strip():
              print("config/config.schema.json is stale. Regenerate with:")
              print("  uv run python -c \"from robotsix_central_deploy.lifecycle.config import LifecycleConfig; import robotsix_config; print(robotsix_config.config_schema_json(LifecycleConfig))\" > config/config.schema.json")
              sys.exit(1)
          EOF
      - name: Check config/config.example.json drift
        run: |
          uv run python - <<'EOF'
          import json, pathlib, sys
          from robotsix_central_deploy.lifecycle.config import LifecycleConfig

          example = json.loads(pathlib.Path("config/config.example.json").read_text())
          example_keys = set(example.keys())

          # Build a default instance and dump its top-level keys.
          # We use model_dump(mode="json") so SecretStr fields come out
          # as cleartext (all empty strings).  The example file may carry
          # richer example values (e.g. llmio_tier_config with 4 levels),
          # so we only compare *key presence*.
          defaults = LifecycleConfig().model_dump(mode="json")
          config_keys = set(defaults.keys())

          missing = config_keys - example_keys
          extra = example_keys - config_keys

          violations = 0
          if missing:
              print(f"::error::Fields missing from config/config.example.json: {', '.join(sorted(missing))}")
              print("Add them with their default values from LifecycleConfig.")
              violations += 1
          if extra:
              # Extra keys are not necessarily an error — the example may
              # include deprecated fields or example-only entries.  Warn
              # but don't fail.
              print(f"::warning::Unexpected keys in config/config.example.json (not in LifecycleConfig): {', '.join(sorted(extra))}")
          if violations:
              sys.exit(1)
          print("config/config.example.json top-level keys match LifecycleConfig.")
          EOF

  openapi-drift:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
      - name: Install dependencies
        run: uv sync --frozen
        env:
          UV_MALWARE_CHECK: ${{ needs.changes.outputs.docs-only == 'true' && '0' || '1' }}
      - name: Regenerate OpenAPI spec
        run: uv run python _gen_openapi.py
      - name: Check for OpenAPI drift
        run: |
          if ! git diff --exit-code docs/lifecycle/openapi.json; then
            echo "::error::docs/lifecycle/openapi.json is stale. Regenerate with:"
            echo "  uv run python _gen_openapi.py"
            exit 1
          fi
      - name: Lint OpenAPI spec with Redocly
        run: npx --yes @redocly/cli@1.27.0 lint docs/lifecycle/openapi.json

  dependency-review:
    # dependency-review-action diffs base..head and only supports
    # pull_request events; on push to main it fails unconditionally.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v4
        with:
          fail-on-severity: high
