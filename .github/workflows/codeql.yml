name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  codeql:
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/codeql.yml@f343f5ca84b1d54bb4c2fdcb83568724aa9f743c  # main
    with:
      languages: python
      queries: security-extended
