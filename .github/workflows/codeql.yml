name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  codeql:
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/codeql.yml@ff5e7748be1809a80700464bcc92177e0d8d5a2a  # main
    with:
      languages: python
      queries: security-extended
