name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
permissions:
  contents: read
jobs:
  codeql:
    permissions:
      contents: read
      security-events: write  # SARIF upload to Code Scanning
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/codeql.yml@f6219bfc4b1d44b8d574a7ea022882a2edba1c6c  # main
    with:
      languages: python
      config-file: .github/codeql/codeql-config.yml
