name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
permissions:
  contents: read
jobs:
  codeql:
    permissions:
      contents: read
      security-events: write  # SARIF upload to Code Scanning
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/codeql.yml@188518bece972d7d5f1c4e2a0f2226d2526dc0fa  # main
    with:
      languages: python
      config-file: .github/codeql/codeql-config.yml
