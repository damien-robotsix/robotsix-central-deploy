name: Docs
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read  # reusable workflow needs checkout
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    permissions:
      # A caller-job permissions map zeroes everything unlisted; the called
      # workflow's build job needs contents:read (checkout), and requesting
      # more than the caller grants fails the whole run at startup.
      contents: read
      pages: write         # deploy to GitHub Pages
      id-token: write      # OIDC token for Pages deployment
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-docs.yml@86a722f2938c1dda343bbf8d3c5989613cbf1794  # v1.5.0
    with:
      docs-install-args: "--group docs"
