name: release-please

# Fleet-wide release automation per robotsix-standards release-please.md.
# Opens/updates a release PR on every push to main; creates the tag and
# GitHub Release when that release PR is merged.
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:

# Serialise releases per branch. Deliberately NOT cancel-in-progress: a cancel
# between pushing the release commit and creating the tag would leave the repo
# half-released.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

# Job-scoped below, not here.
permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release commit, tag and GitHub Release
      pull-requests: write  # open and update the release PR
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.head.ref == 'release-please--branches--main')
    steps:
      # A release PR opened with GITHUB_TOKEN triggers no workflow runs, so its
      # required checks never report and it can never merge. Mint an App token.
      - name: Mint a GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Scoped: an unscoped token inherits the App's blanket installation
          # permissions (zizmor github-app, high).
          permission-contents: write        # release commit, tag, Release
          permission-pull-requests: write   # open and update the release PR

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

      # Only the lock-sync step needs these; release-please needs neither.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.release.outputs.prs_created == 'true' || steps.release.outputs.pr != ''
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        if: steps.release.outputs.prs_created == 'true' || steps.release.outputs.pr != ''
        with:
          # No cache: this job has contents:write, and a poisoned cache in a
          # write-privileged workflow is a supply-chain risk.
          enable-cache: false

      # uv.lock records the project's own version, so a release that bumps
      # [project].version leaves it stale and `uv sync --locked` fails.
      - name: Sync uv.lock to the released version
        if: steps.release.outputs.prs_created == 'true' || steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: release-please--branches--main
        run: |
          set -euo pipefail
          # The release branch is deleted when its PR merges, yet a later
          # run can still report an existing PR and satisfy this step's
          # guard. A missing branch means there is nothing to sync — not a
          # failure. Without this the job dies on `git checkout -B` with
          # "not a commit", reddening main.
          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "No $BRANCH on origin — nothing to sync."
            exit 0
          fi
          git fetch --depth=1 origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          uv lock
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already matches the released version."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync uv.lock to the released version" -- uv.lock
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
