services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      # Allow only the Docker API paths central-deploy actually calls:
      # containers (list/inspect/start/stop/restart/remove/create/logs)
      # images (pull)
      CONTAINERS: "1"
      POST: "1"     # required to allow any POST method
      DELETE: "1"   # required for container removal during deploy
      IMAGES: "1"   # required for image pull
      BUILD: "1"    # required for the "Reclaim build cache" button (POST /build/prune)
      NETWORKS: "1" # required by the self-update watchtower: it recreates the
                    # central-deploy container and re-attaches its networks via
                    # POST /networks/{id}/connect (403 without this scope)
      # Everything else OFF:
      AUTH: "0"
      COMMIT: "0"
      CONFIGS: "0"
      DISTRIBUTION: "0"
      EXEC: "0"
      NODES: "0"
      PLUGINS: "0"
      SECRETS: "0"
      SERVICES: "0"
      SESSION: "0"
      SWARM: "0"
      SYSTEM: "1"   # enables /system/df for Docker disk-usage reporting
      TASKS: "0"
      VOLUMES: "1"   # required for named-volume create/list/inspect/remove
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # TCP port 2375 is NOT bound to the host; only reachable within this compose network
    networks:
      - internal

  central-deploy:
    # Published by .github/workflows/release.yml on every push to main;
    # `docker compose pull` updates it. `build: .` remains for local dev
    # (`docker compose up --build`).
    image: ghcr.io/damien-robotsix/robotsix-central-deploy:main
    build: .
    restart: unless-stopped
    environment:
      # Since the robotsix_config migration, ROBOTSIX_LIFECYCLE_* env vars are
      # dead — ALL config values live in one JSON file. This var only locates
      # it. Seed /data/config.json before first start (see docs/deployment.md);
      # without it the baked-in config/config.json defaults apply (unix docker
      # socket, in-memory store) and the server cannot reach the socket proxy.
      ROBOTSIX_CONFIG_FILE: "/data/config.json"
    volumes:
      - central_deploy_data:/data
      - /:/host_root:ro      # exposes host filesystem at /host_root (read-only)
    # No host port. central-deploy is reachable only over central-deploy-proxy,
    # via Traefik, which authenticates every request. Publishing 127.0.0.1:8100
    # would be a way onto the control plane that skips the fleet's auth gate.
    labels:
      traefik.enable: "true"
      traefik.docker.network: central-deploy-proxy
      traefik.http.services.central-deploy.loadbalancer.server.port: "8100"
      # The dashboard answers on the bare base domain; components live on
      # subdomains of it. Same three-router shape central-deploy stamps on
      # every component (registry/traefik_labels.py) — kept literal here
      # because central-deploy cannot label its own container.
      traefik.http.routers.central-deploy-health.rule: "Host(`${GATEWAY_BASE_DOMAIN}`) && Path(`/health`)"
      traefik.http.routers.central-deploy-health.priority: "30"
      traefik.http.routers.central-deploy-health.entrypoints: websecure
      traefik.http.routers.central-deploy-health.service: central-deploy
      traefik.http.routers.central-deploy-machine.rule: "Host(`${GATEWAY_BASE_DOMAIN}`) && HeaderRegexp(`Authorization`, `^Basic `)"
      traefik.http.routers.central-deploy-machine.priority: "20"
      traefik.http.routers.central-deploy-machine.entrypoints: websecure
      traefik.http.routers.central-deploy-machine.middlewares: fleet-basicauth@file
      traefik.http.routers.central-deploy-machine.service: central-deploy
      traefik.http.routers.central-deploy.rule: "Host(`${GATEWAY_BASE_DOMAIN}`)"
      traefik.http.routers.central-deploy.priority: "10"
      traefik.http.routers.central-deploy.entrypoints: websecure
      traefik.http.routers.central-deploy.middlewares: tinyauth@file
      traefik.http.routers.central-deploy.service: central-deploy
    depends_on:
      - socket-proxy
    networks:
      - internal
      - central-deploy-proxy

  # ── The fleet edge ────────────────────────────────────────────────────
  # Terminates TLS, authenticates, and routes to every component. Runs as a
  # separate container from central-deploy on purpose: restarting or
  # self-updating the deployer must not take the fleet's UIs offline, which is
  # exactly what the old in-process gateway did.
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    # Static configuration lives here rather than in a traefik.yml, because
    # Traefik does not merge static-config sources — the docs are explicit that
    # mixing a file with TRAEFIK_* env vars "is not supported and can lead to
    # unexpected behavior". Compose interpolates ${...} in this block, so the
    # deployment-specific values come from .env and no domain is committed.
    command:
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      # One wildcard for the whole fleet, requested at the entrypoint rather
      # than per-router: per-router would mean an ACME order per component and
      # a rate-limit problem on any day with several onboardings.
      - "--entrypoints.websecure.http.tls.certresolver=ovh"
      - "--entrypoints.websecure.http.tls.domains[0].main=${GATEWAY_BASE_DOMAIN:?set GATEWAY_BASE_DOMAIN in .env}"
      - "--entrypoints.websecure.http.tls.domains[0].sans=*.${GATEWAY_BASE_DOMAIN}"
      # Routes come from container labels. Nothing is published unless it
      # carries traefik.enable=true, or every managed container would be
      # exposed the moment it started.
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://traefik-socket-proxy:2375"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=central-deploy-proxy"
      # Fleet-wide middleware (the auth gates). Dynamic config is a separate
      # source from static config, so a file here is fine.
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      # Wildcards are only obtainable via DNS-01. The OVH credentials are read
      # by the ACME provider from OVH_* in the environment, not by the config
      # parser, so they do not count as a second static-config source.
      - "--certificatesresolvers.ovh.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.ovh.acme.dnschallenge=true"
      - "--certificatesresolvers.ovh.acme.dnschallenge.provider=ovh"
      # OVH's nameservers are slow to converge; without a delay the first order
      # fails its self-check and Traefik retries with backoff.
      - "--certificatesresolvers.ovh.acme.dnschallenge.delaybeforecheck=10"
      - "--certificatesresolvers.ovh.acme.email=${ACME_EMAIL:?set ACME_EMAIL in .env}"
      - "--log.level=INFO"
      - "--accesslog=true"
      # No dashboard: it would need its own hostname and its own auth rule, and
      # `docker logs traefik` plus the access log answer the same questions.
      - "--api.dashboard=false"
    environment:
      # OVH API credentials for the DNS-01 wildcard challenge. These are read
      # by the ACME provider, not by Traefik's config parser, so they are not a
      # second static-configuration source.
      OVH_ENDPOINT: "${OVH_ENDPOINT:-ovh-eu}"
      OVH_APPLICATION_KEY: "${OVH_APPLICATION_KEY:?set OVH_APPLICATION_KEY in .env}"
      OVH_APPLICATION_SECRET: "${OVH_APPLICATION_SECRET:?set OVH_APPLICATION_SECRET in .env}"
      OVH_CONSUMER_KEY: "${OVH_CONSUMER_KEY:?set OVH_CONSUMER_KEY in .env}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      # The fleet machine credential. Git-ignored — this repo is public, so the
      # hash must never be committed. Seed it by copying the existing nginx
      # htpasswd across; the current password then keeps working unchanged:
      #   cp /etc/nginx/htpasswd/<your-vhost> ./deploy/traefik/fleet-users
      - ./deploy/traefik/fleet-users:/etc/traefik/fleet-users:ro
      - traefik_letsencrypt:/letsencrypt
    depends_on:
      - traefik-socket-proxy
      - tinyauth
    networks:
      - internal
      - central-deploy-proxy

  # Traefik's own window onto the Docker API: containers and events, read-only.
  # Deliberately NOT the socket-proxy central-deploy uses — that one grants
  # POST/DELETE/IMAGES so the deployer can manage containers, and the edge has
  # no business with any of it.
  traefik-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: "1"   # read container labels to build routes
      EVENTS: "1"       # watch for containers starting/stopping
      POST: "0"         # no mutations of any kind
      DELETE: "0"
      IMAGES: "0"
      BUILD: "0"
      NETWORKS: "0"
      VOLUMES: "0"
      SYSTEM: "0"
      AUTH: "0"
      EXEC: "0"
      SECRETS: "0"
      SERVICES: "0"
      SWARM: "0"
      NODES: "0"
      TASKS: "0"
      CONFIGS: "0"
      PLUGINS: "0"
      SESSION: "0"
      COMMIT: "0"
      DISTRIBUTION: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal

  # ── The fleet's single sign-on gate ───────────────────────────────────
  # One login for the dashboard and every component UI. Components ship no auth
  # of their own — see the component standard in robotsix-standards.
  tinyauth:
    image: ghcr.io/tinyauthapp/tinyauth:v5
    restart: unless-stopped
    environment:
      TINYAUTH_APP_URL: "https://auth.${GATEWAY_BASE_DOMAIN}"
      TINYAUTH_SECRET: "${TINYAUTH_SECRET:?set TINYAUTH_SECRET in .env (32 chars)}"
      # user:bcrypt-hash — generate with `htpasswd -nbB <user> '<password>'`.
      # Compose eats a single `$`, so every `$` in the hash must be doubled
      # when the value is written inline rather than supplied via .env.
      TINYAUTH_AUTH_USERS: "${TINYAUTH_AUTH_USERS:?set TINYAUTH_AUTH_USERS in .env}"
      # Trust X-Forwarded-For only from the edge network, so a client cannot
      # spoof its own IP past the rate limiter. Must match the pinned subnet
      # of central-deploy-proxy below.
      TINYAUTH_AUTH_TRUSTEDPROXIES: "172.24.0.0/16"
    volumes:
      - tinyauth_data:/data
    labels:
      # tinyauth needs a public hostname of its own: the browser is redirected
      # here to log in, so this router must not be behind the tinyauth
      # middleware or the redirect would loop.
      traefik.enable: "true"
      traefik.docker.network: central-deploy-proxy
      traefik.http.routers.tinyauth.rule: "Host(`auth.${GATEWAY_BASE_DOMAIN}`)"
      traefik.http.routers.tinyauth.entrypoints: websecure
      traefik.http.services.tinyauth.loadbalancer.server.port: "3000"
    networks:
      - central-deploy-proxy

volumes:
  central_deploy_data:
  traefik_letsencrypt:
  tinyauth_data:

networks:
  internal:
    driver: bridge
  central-deploy-proxy:
    driver: bridge
    name: central-deploy-proxy
    # Pinned so TINYAUTH_AUTH_TRUSTEDPROXIES can name it. Docker would
    # otherwise pick a subnet from its pool and the value would drift.
    #
    # This value must match the network as it already exists on the host —
    # changing it makes compose try to recreate the network, which means
    # disconnecting every managed container attached to it. Check with:
    #   docker network inspect central-deploy-proxy --format '{{range .IPAM.Config}}{{.Subnet}}{{end}}'
    ipam:
      config:
        - subnet: 172.24.0.0/16
